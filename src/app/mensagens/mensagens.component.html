<section class="conversation-panel">
  <header class="conversation-header">
    <a routerLink="/conversas" aria-label="Voltar para contatos">←
    </a>
    <h2>{{ usuario?.nome || 'Conversa' }}</h2>
  </header>

  <div class="message-list">
    <p class="empty" *ngIf="mensagens.length === 0">
      Envie uma mensagem para começar.
    </p>
    <div class="message-row" *ngFor="let mensagem of mensagens">
      <div class="message-bubble" *ngIf="isMinhaMensagem(mensagem)">{{ mensagem.conteudo }}</div>
      <div class="minha-message-bubble" *ngIf="!isMinhaMensagem(mensagem)">{{ mensagem.conteudo }}</div>
      <div class="message-bubble">{{ formatarDataHora(mensagem.horaEnvio) }}</div>
    </div>
  </div>

  <form class="composer" (ngSubmit)="enviar()">
    <input name="novaMensagem" [(ngModel)]="novaMensagem"
      placeholder="Digite uma mensagem..." autocomplete="off"
      (keydown.enter)="$event.preventDefault(); enviar();">
    <button type="submit" [disabled]="!novaMensagem.trim()">Enviar</button>
  </form>
</section>
